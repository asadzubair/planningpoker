<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sprint Planning Poker</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eceef4;--ink:#17202e;--mut:#5d6778;--acc:#3b34c4;--gold:#f2b544;--ok:#1f9d6b;--line:#d5d9e4;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:920px;margin:0 auto;padding:20px 16px 40px}.narrow{max-width:460px}
h1,h2{margin:0;letter-spacing:-.02em}.logo{font-size:34px;line-height:1.1;font-weight:800;color:var(--acc);margin-bottom:4px}
.lead{color:var(--mut);margin:6px 0 20px}.note{color:var(--mut);font-size:13px}
.panel{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
label{display:block;font-weight:600;font-size:14px;margin-bottom:12px}
input{display:block;width:100%;margin-top:4px;padding:11px 12px;font:inherit;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn{font:inherit;font-weight:600;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;min-height:44px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}.btn.dng{color:#b42318}
.tabs{display:flex;gap:6px;margin-bottom:16px}.tabs button{flex:1;font:inherit;font-weight:600;padding:10px;border:0;border-bottom:3px solid var(--line);background:none;cursor:pointer;color:var(--mut)}
.tabs .on{border-color:var(--acc);color:var(--ink)}
.err{color:#b42318;min-height:1.4em;margin:0 0 8px;font-size:14px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>input{flex:1;min-width:180px;margin:0}
.room{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.room:first-of-type{border-top:0}.room b{font-size:17px}
.bar{display:flex;align-items:center;gap:12px;margin-bottom:14px}.bar>div{flex:1;min-width:0}
.bar h2{font-size:24px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{color:var(--acc);font-weight:600;text-decoration:none}
.cs{font-size:13px;color:var(--mut)}.cs.live{color:var(--ok)}.cs.bad{color:#b42318}
.topic{font-size:18px;font-weight:600;margin:0 0 12px;min-height:2.4em}
input.topic{border-style:dashed}
.table{background:var(--ink);border-radius:20px;padding:22px 14px;min-height:190px;display:flex;flex-wrap:wrap;gap:18px 14px;justify-content:center;align-content:center}
.pl{width:88px;text-align:center;color:#cfd6e6;font-size:13px}.pl.me .nm{color:var(--gold);font-weight:600}
.nm{margin-top:6px;word-break:break-word;line-height:1.2}
.x{border:0;background:none;color:#8b95a8;font-size:16px;cursor:pointer;padding:0 4px}
.pc{width:62px;height:88px;margin:0 auto;border-radius:9px;display:grid;place-items:center;font-size:30px;font-weight:800}
.pc.none{border:2px dashed #46526a}
.pc.back{background:repeating-linear-gradient(45deg,var(--acc) 0 6px,#2c2699 6px 12px);border:3px solid #fff}
.pc.face{background:#fff;color:var(--ink)}
.pop .pc.face,.pop .v{animation:flip .45s ease-out}@keyframes flip{from{transform:rotateY(90deg)}to{transform:none}}
.tbl{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.est{width:100%;border-collapse:collapse}
.est th{text-align:left;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);padding:12px 18px;background:#f6f7fb;border-bottom:1px solid var(--line)}
.est td{padding:8px 18px;border-top:1px solid var(--line);font-size:17px;height:54px;word-break:break-word}
.est tbody tr:first-child td{border-top:0}
.est th:last-child,.est td:last-child{width:38%}
.est .v{font-size:28px;font-weight:800;color:var(--acc);display:inline-block}
.est .ok{color:var(--ok);font-weight:600}.est .w{color:var(--mut)}.est .x{color:var(--mut);font-size:18px;margin-left:6px}
@media(prefers-reduced-motion:reduce){.pop .pc.face,.pop .v{animation:none}}
select,textarea{font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
textarea{width:100%;font:13px/1.4 ui-monospace,Consolas,monospace;resize:vertical}
.lnk{background:none;border:0;color:var(--acc);font:inherit;font-size:13px;padding:0;cursor:pointer;text-decoration:underline}
.stats{font-weight:600;margin:14px 2px;min-height:1.5em}.stats i{font-style:normal;color:var(--acc)}
.ctl{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}.ctl .btn{flex:1}
.deck{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.dc{aspect-ratio:5/7;font:inherit;font-size:clamp(22px,6vw,38px);font-weight:800;background:#fff;color:var(--ink);border:2px solid var(--line);border-radius:12px;cursor:pointer;transition:transform .12s}
.dc.sel{transform:translateY(-10px);border-color:var(--gold);box-shadow:0 0 0 3px var(--gold);color:var(--acc)}
.dc:disabled{opacity:.5;cursor:not-allowed}
</style>
</head>
<body>
<div id="app"></div>
<script>/*SUPABASE_INLINE*/</script>
<script>
/* ===== Configuration =====
   The URL and the anon key below are PUBLIC by design: every Supabase web app ships them.
   Your data is protected by the access rules in the database, not by hiding this key.
   Never put the service_role / secret key in this file. */
const SB_URL='https://avbpjjqdtmuqclfpqxlb.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImF2YnBqanFkdG11cWNsZnBxeGxiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU0ODU1NzEsImV4cCI6MjExMTA2MTU3MX0.-i2w8DqlZHcU3hTwI_1jkSJ0gfGgJXcYzsI07DmO_Lc';
const OWNER='asad.zubair@10pearls.com';
const LIB=['https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.47.10/dist/umd/supabase.js','https://unpkg.com/@supabase/supabase-js@2.47.10/dist/umd/supabase.js'];
const DECK=[1,3,5,8,13,21];

const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const view=h=>{$('#app').innerHTML=h};
const setHTML=(el,h)=>{if(el._h!==h){el._h=h;el.innerHTML=h}};
const mem={};
const store={get(k){try{return sessionStorage.getItem(k)}catch{return mem[k]??null}},set(k,v){try{sessionStorage.setItem(k,v)}catch{mem[k]=v}},del(k){try{sessionStorage.removeItem(k)}catch{delete mem[k]}}};
const pref={get(k){try{return localStorage.getItem(k)||''}catch{return mem['l'+k]||''}},set(k,v){try{localStorage.setItem(k,v)}catch{mem['l'+k]=v}}};
const direct=/^https?:/.test(location.href);
const base=()=>direct?location.origin+location.pathname:(document.referrer||'').split('#')[0];
const invite=code=>direct?base()+'#/join/'+code:`Join our planning poker session: ${base()||'(open the planning poker page)'}\nEnter room code: ${code}`;
const copy=async(t,btn)=>{
  try{await navigator.clipboard.writeText(t);if(btn){const o=btn.textContent;btn.textContent='Copied';setTimeout(()=>btn.textContent=o,1500)}}
  catch{let d=$('#lk');if(!d){d=document.createElement('input');d.id='lk';d.readOnly=true;d.setAttribute('aria-label','Invite link');d.style.cssText='position:fixed;left:12px;right:12px;bottom:12px;z-index:9;box-shadow:0 4px 20px #0004';document.body.appendChild(d)}
    d.value=t;d.focus();d.select();if(btn)btn.textContent='Select and copy below'}
};
const friendly=e=>{const m=String((e&&e.message)||e||'');
  if(m.includes('room_not_found'))return 'Room not found. Check the code.';
  if(m.includes('removed'))return 'You were removed from this room by the host.';
  if(m.includes('not_joined'))return 'You are no longer in this room. Reloading…';
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))return 'Cannot reach the server. Check your internet connection.';
  return m||'Something went wrong.'};

/* ===== Supabase client ===== */
let sb=null,me=null,recovering=false,urlErr='';
let libP=null;
function loadLib(){
  return libP||(libP=(async()=>{
    if(window.supabase&&supabase.createClient)return;
    for(const u of LIB){
      try{await new Promise((ok,no)=>{const s=document.createElement('script'),t=setTimeout(no,10000);s.src=u;s.onload=()=>{clearTimeout(t);ok()};s.onerror=()=>{clearTimeout(t);no()};document.head.appendChild(s)});
        if(window.supabase&&supabase.createClient)return}catch{}
    }
    libP=null;throw Error('lib');
  })());
}
async function init(){
  await loadLib();
  sb=supabase.createClient(SB_URL,SB_KEY,{auth:{flowType:'pkce',detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}});
  sb.auth.onAuthStateChange(evt=>{
    if(evt==='PASSWORD_RECOVERY'){recovering=true;route()}
    if(evt==='SIGNED_OUT'){me=null;if(!/^#\/join\//.test(location.hash))route()}
  });
}
async function loadMe(){
  me=null;
  const{data:{session}}=await sb.auth.getSession();
  if(!session)return;
  const{data,error}=await sb.rpc('my_role');
  if(!error&&data&&data.role)me=data;
}

/* ===== Sign in / register / reset ===== */
function authView(mode='in',note=''){
  const up=mode==='up',fg=mode==='fg';
  view(`<main class="wrap narrow"><h1 class="logo">Sprint Planning Poker</h1>
  <p class="lead">Planning poker for sprint estimates. Approved hosts sign in to open a room. Everyone else joins with a room code or invite link, no account needed.</p>
  <div class="panel"><div class="tabs"><button data-m="in" class="${mode==='in'?'on':''}">Sign in</button><button data-m="up" class="${up?'on':''}">Register</button></div>
  <div id="f">${up?'<label>Your name<input name="name" required autocomplete="name" maxlength="40"></label>':''}
  <label>Email<input name="email" type="email" required autocomplete="email"></label>
  ${fg?'':`<label>Password<input name="pw" type="password" required minlength="8" autocomplete="${up?'new-password':'current-password'}"></label>`}
  <p class="err" id="err">${esc(note||urlErr)}</p><button class="btn pri" id="sb" type="button" style="width:100%">${up?'Create account':fg?'Send reset link':'Sign in'}</button>
  ${mode==='in'?'<p style="margin:12px 0 0;text-align:center"><button class="lnk" id="fg" type="button">Forgot password?</button></p>':''}${fg?'<p style="margin:12px 0 0;text-align:center"><button class="lnk" id="bk" type="button">Back to sign in</button></p>':''}</div></div>
  <div class="panel"><p style="margin:0 0 8px;font-weight:600">Joining a team session?</p><div class="row"><input id="jc" aria-label="Room code" placeholder="Room code or invite link" autocomplete="off"><button class="btn" id="jg" type="button">Join</button></div><p class="err" id="je" style="margin:6px 0 0"></p></div>
  <p class="note">Only hosts approved by a superadmin can register. Registration needs email confirmation.</p></main>`);
  urlErr='';
  $$('.tabs button').forEach(b=>b.onclick=()=>authView(b.dataset.m));
  const fgb=$('#fg');if(fgb)fgb.onclick=()=>authView('fg');
  const bk=$('#bk');if(bk)bk.onclick=()=>authView('in');
  const val=n=>{const i=$('#f [name='+n+']');return i?i.value:''};
  const go=async()=>{
    const err=$('#err'),btn=$('#sb'),email=val('email').trim().toLowerCase(),pw=val('pw'),name=val('name').trim();
    if(up&&!name)return err.textContent='Enter your name.';
    if(!/^\S+@\S+\.\S+$/.test(email))return err.textContent='Enter a valid email address.';
    if(!fg&&pw.length<8)return err.textContent='Password must be at least 8 characters.';
    err.textContent='Working…';btn.disabled=true;
    try{
      const page=location.origin+location.pathname;
      if(fg){
        const{error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:page});
        if(error)throw error;
        err.style.color='var(--ok)';err.textContent='If that email can host, a reset link is on its way.';
      }else if(up){
        const{data,error}=await sb.auth.signUp({email,password:pw,options:{data:{name},emailRedirectTo:page}});
        if(error)throw error;
        if(data.session){await loadMe();return finishSignIn()}
        err.style.color='var(--ok)';err.textContent='Almost done. Check '+email+' for a confirmation link, then sign in.';
      }else{
        const{error}=await sb.auth.signInWithPassword({email,password:pw});
        if(error)throw error;
        await loadMe();finishSignIn();
      }
    }catch(x){
      const m=String(x.message||x);err.style.color='';
      err.textContent=/Database error|not approved/i.test(m)?'This email is not approved to host. Ask a superadmin to add you.'
        :/Invalid login/i.test(m)?'Email or password is incorrect.'
        :/not confirmed/i.test(m)?'Please confirm your email first. Check your inbox for the link.'
        :/already registered/i.test(m)?'That email is already registered. Sign in instead.'
        :/rate limit/i.test(m)?'Too many emails were requested. Please wait a few minutes and try again.'
        :friendly(x);
    }finally{if(btn)btn.disabled=false}
  };
  const finishSignIn=async()=>{
    if(!me){await sb.auth.signOut();return authView('in','This account is not approved to host. Ask a superadmin to add your email.')}
    route();
  };
  $('#sb').onclick=go;$('#f').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go()}};
  const jj=()=>{const v=$('#jc').value.trim(),m=v.match(/join\/([a-z0-9]+)/i)||v.match(/^([a-z0-9]{6,12})$/i);if(!m)return $('#je').textContent='Enter the room code from your scrum master.';location.hash='#/join/'+m[1].toLowerCase()};
  $('#jg').onclick=jj;$('#jc').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();jj()}};
}
function recoverView(){
  view(`<main class="wrap narrow"><h1 class="logo">Sprint Planning Poker</h1><p class="lead">Choose a new password.</p>
  <div class="panel" id="rf"><label>New password<input id="np" type="password" minlength="8" autocomplete="new-password"></label><p class="err" id="err"></p><button class="btn pri" id="rb" type="button" style="width:100%">Save password</button></div></main>`);
  const go=async()=>{const p=$('#np').value;if(p.length<8)return $('#err').textContent='Password must be at least 8 characters.';
    const{error}=await sb.auth.updateUser({password:p});
    if(error)return $('#err').textContent=friendly(error);
    recovering=false;await loadMe();route()};
  $('#rb').onclick=go;$('#rf').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go()}};
}

/* ===== Host dashboard ===== */
async function dash(){
  view('<main class="wrap"><p class="note">Loading…</p></main>');
  const{data,error}=await sb.rpc('my_rooms');
  const rs=error?[]:data||[],super_=me.role==='superadmin';
  view(`<main class="wrap"><div class="bar"><div><h2>Hi, ${esc(me.name||me.email)}</h2><span class="cs">${super_?'Superadmin':'Admin'} · Your planning rooms</span></div>${super_?'<a class="btn" href="#/admin" style="text-decoration:none;display:inline-grid;place-items:center">Admin area</a>':''}<button class="btn" id="out">Sign out</button></div>
  <div class="panel row" id="nf"><input id="rn" placeholder="New room name, e.g. Sprint 42 refinement" maxlength="80" aria-label="Room name"><button class="btn pri" id="nb" type="button">Create room</button></div>
  <p class="err" id="derr">${error?esc(friendly(error)):''}</p>
  <div class="panel" id="rl">${rs.length?rs.map(r=>`<div class="room"><b>${esc(r.name)}</b><span class="row"><a class="btn pri sm" href="#/host/${r.code}" style="text-decoration:none;display:inline-grid;place-items:center">Open</a><button class="btn sm" data-c="${r.code}">Copy invite link</button><button class="btn sm dng" data-d="${r.code}">Delete</button></span></div>`).join(''):'<p class="note" style="margin:0">No rooms yet. Create one above, then share its invite link with your team.</p>'}</div></main>`);
  $('#out').onclick=async()=>{await sb.auth.signOut();me=null;location.hash='#/';route()};
  const mk=async()=>{const n=$('#rn').value.trim();if(!n)return $('#rn').focus();
    $('#nb').disabled=true;const{data:code,error}=await sb.rpc('create_room',{p_name:n});
    if(error){$('#nb').disabled=false;return $('#derr').textContent=friendly(error)}
    location.hash='#/host/'+code};
  $('#nb').onclick=mk;$('#nf').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();mk()}};
  $('#rl').onclick=async e=>{const c=e.target.closest('[data-c]'),d=e.target.closest('[data-d]');
    if(c)copy(invite(c.dataset.c),c);
    if(d){if(d.dataset.sure){const{error}=await sb.rpc('delete_room',{p_code:d.dataset.d});if(error)$('#derr').textContent=friendly(error);else dash()}
      else{d.dataset.sure=1;d.textContent='Click again to delete'}}};
}

/* ===== Admin area (superadmins) ===== */
async function adminView(){
  view('<main class="wrap"><p class="note">Loading…</p></main>');
  const{data,error}=await sb.rpc('list_host_roles');
  if(error){location.hash='#/';return}
  const sa=data.filter(r=>r.role==='superadmin'),ad=data.filter(r=>r.role==='admin');
  const row=(r)=>`<div class="room"><span><b>${esc(r.email)}</b> <span class="cs">${r.role==='superadmin'?'Superadmin':'Admin'}${r.protected?' · owner, protected':''}${r.email===me.email?' · you':''}</span></span>${r.protected||r.email===me.email?'':`<button class="btn sm dng" data-r="${esc(r.email)}">Remove</button>`}</div>`;
  view(`<main class="wrap"><div class="bar"><a href="#/" class="back">‹ Rooms</a><div><h2>Admin area</h2><span class="cs">Who can host planning rooms</span></div></div>
  <div class="panel" id="af"><p style="margin:0 0 10px;font-weight:600">Add a person</p><div class="row"><input id="ae" type="email" placeholder="name@company.com" aria-label="Email address" autocomplete="off"><select id="ar" aria-label="Role"><option value="admin">Admin</option><option value="superadmin">Superadmin</option></select><button class="btn pri" id="ab" type="button">Add</button></div><p class="err" id="aerr" style="margin:6px 0 0"></p>
  <p class="note" style="margin:6px 0 0">They then register with this email and confirm it from their inbox.</p></div>
  <div class="panel" id="lst"><p style="margin:0 0 4px;font-weight:600">Superadmins</p>${sa.map(row).join('')}<p style="margin:16px 0 4px;font-weight:600">Admins</p>${ad.length?ad.map(row).join(''):'<p class="note" style="margin:0">No admins yet.</p>'}</div></main>`);
  const add=async()=>{const e=$('#ae').value.trim(),err=$('#aerr');
    if(!e)return $('#ae').focus();
    const{error}=await sb.rpc('add_host_role',{p_email:e,p_role:$('#ar').value});
    if(error)return err.textContent=friendly(error);
    adminView()};
  $('#ab').onclick=add;$('#af').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add()}};
  $('#lst').onclick=async e=>{const b=e.target.closest('[data-r]');if(!b)return;
    if(!b.dataset.sure){b.dataset.sure=1;b.textContent='Click again to remove';return}
    const{error}=await sb.rpc('remove_host_role',{p_email:b.dataset.r});
    if(error)return $('#aerr').textContent=friendly(error);
    adminView()};
}

/* ===== Room: shared engine (host and team) ===== */
let C=null,S=null,myVote=null,isHost=false,meId='',prevRev=false;
function teardown(){
  if(C){C.dead=true;clearTimeout(C.timer);clearTimeout(C.poke);try{C.ch&&sb.removeChannel(C.ch)}catch{}}
  C=null;S=null;myVote=null;prevRev=false;isHost=false;meId='';
}
function setConn(t,cls=''){const e=$('#cs');if(e){e.textContent=t;e.className='cs '+cls}}
const setStatus=c=>setConn(c.live?'Live':'Connected · updating every few seconds',c.live?'live':'');

function shell(host,title,code){
  view(`<main class="wrap"><header class="bar"><a href="#/" class="back" ${host?'':'hidden'}>‹ Rooms</a><div><h2 id="rt">${esc(title)}</h2><span id="cs" class="cs">Connecting…</span>${host?`<br><span class="cs">Room code: <b>${esc(code)}</b></span>`:''}</div>${host?'<button class="btn" id="cp">Copy invite link</button>':''}</header>
  ${host?'<input id="topic" class="topic" maxlength="120" placeholder="What are we estimating? (optional)" aria-label="Story being estimated">':'<p id="topicv" class="topic"></p>'}
  ${host?`<div class="ctl"><button class="btn pri" id="rv">Show estimates</button><button class="btn" id="cl">Clear estimates</button></div><p class="stats" id="stats"></p><section class="tbl" id="tb" aria-live="polite"></section>`:`<section class="table" id="tb" aria-live="polite"><p style="color:#8b95a8;margin:0;align-self:center">Connecting to the room…</p></section><p class="stats" id="stats"></p><section class="deck" id="dk"></section><p class="note" id="hint" style="margin:10px 2px 0;min-height:1.4em"></p>`}</main>`);
  if(host){
    $('#cp').onclick=e=>copy(invite(code),e.target);
    let t;$('#topic').oninput=e=>{clearTimeout(t);t=setTimeout(()=>act('host_set_topic',{p_topic:e.target.value}),400)};
    $('#rv').onclick=()=>act('host_reveal');
    $('#cl').onclick=()=>act('host_clear');
    $('#tb').onclick=e=>{const k=e.target.closest('[data-k]');if(k)act('host_kick',{p_pid:k.dataset.k})};
  }else{
    $('#dk').onclick=e=>{const b=e.target.closest('[data-v]');if(b)castVote(+b.dataset.v)};
  }
}

async function act(fn,args={}){
  const c=C;if(!c)return;
  const{error}=await sb.rpc(fn,{p_code:c.code,...args});
  if(c.dead)return;
  if(error)setConn(friendly(error),'bad');
  refresh();
}

function subscribe(c){
  const ch=sb.channel('room:'+c.code,{config:{private:true}});
  ch.on('broadcast',{event:'changed'},()=>poke(c)).subscribe(st=>{
    if(c.dead)return;
    c.live=(st==='SUBSCRIBED');setStatus(c);
    if(c.live)poke(c);
  });
  c.ch=ch;
}
function poke(c){clearTimeout(c.poke);c.poke=setTimeout(()=>{if(!c.dead)refresh()},150)}
function loop(c){
  if(c.dead)return;
  c.timer=setTimeout(async()=>{await refresh();loop(c)},c.live?15000:3000);
}
function stopRoom(c,msg){
  c.dead=true;clearTimeout(c.timer);try{c.ch&&sb.removeChannel(c.ch)}catch{}
  setConn(msg,'bad');
  const tb=$('#tb');if(tb&&!c.host)tb.innerHTML='<p style="color:#8b95a8;margin:0;align-self:center;text-align:center">'+esc(msg)+'</p>';
  const dk=$('#dk');if(dk)dk.innerHTML='';
}

async function refresh(){
  const c=C;if(!c||c.dead)return;
  if(c.busy){c.again=true;return}
  c.busy=true;
  try{
    const{data,error}=await sb.rpc('room_state',{p_code:c.code,p_pid:c.pid,p_secret:c.secret});
    if(c.dead)return;
    if(error)throw error;
    await apply(c,data);
  }catch(e){
    if(c.dead)return;
    if(String(e.message||e).includes('room_not_found'))return stopRoom(c,'This room no longer exists. Ask the host for a new code.');
    setConn(friendly(e)+' Retrying…','bad');
  }finally{
    c.busy=false;
    if(c.again&&!c.dead){c.again=false;refresh()}
  }
}

async function apply(c,data){
  if(data.kicked){store.del('pp.p.'+c.code);return stopRoom(c,'You were removed from this room by the host.')}
  if(c.host&&!data.is_host){location.hash='#/';return}
  if(!c.host&&!data.players.some(p=>p.id===c.pid)&&!c.rejoining){
    c.rejoining=true;
    try{await joinCall(c)}catch(e){c.rejoining=false;throw e}
    c.rejoining=false;
    return refresh();
  }
  S={...data,players:Object.fromEntries(data.players.map(p=>[p.id,p]))};
  if(!c.host&&!c.voting)myVote=data.my_vote;
  const rt=$('#rt');if(rt&&data.name)rt.textContent=data.name;
  const ti=$('#topic');if(ti&&document.activeElement!==ti&&ti.value!==data.topic)ti.value=data.topic;
  setStatus(c);
  render();
}

function hostTable(ps,rev){
  const cell=p=>rev?(p.vote!=null?`<b class="v">${p.vote}</b>`:'<span class="w">No estimate</span>'):(p.voted?'<span class="ok">✓ Voted</span>':'<span class="w">Waiting…</span>');
  const rows=ps.length?ps.map(([id,p])=>`<tr><td>${esc(p.name)}<button class="x" data-k="${id}" aria-label="Remove ${esc(p.name)}">×</button></td><td>${cell(p)}</td></tr>`).join('')
    :`<tr><td colspan="2" class="w" style="height:90px">Waiting for the team to join. Share room code <b>${esc(S.code)}</b>.</td></tr>`;
  return `<table class="est"><thead><tr><th scope="col">Name</th><th scope="col">Estimate</th></tr></thead><tbody>${rows}</tbody></table>`;
}
function render(){
  if(!S||!C||!$('#tb'))return;
  const ps=Object.entries(S.players),rev=S.revealed;
  $('#tb').className=(isHost?'tbl':'table')+(rev&&!prevRev?' pop':'');prevRev=rev;
  setHTML($('#tb'),isHost?hostTable(ps,rev):ps.map(([id,p])=>{const face=rev&&p.vote!=null;
    return `<div class="pl${id===meId?' me':''}"><div class="pc ${face?'face':p.voted?'back':'none'}">${face?p.vote:''}</div><div class="nm">${esc(p.name)}</div></div>`}).join(''));
  const v=ps.map(([,p])=>p.vote).filter(x=>x!=null),voted=ps.filter(([,p])=>p.voted).length;
  let st=ps.length?`${voted} of ${ps.length} voted`:'Waiting for the team to join';
  if(rev&&ps.length){
    if(!v.length)st='No estimates were entered.';
    else{const cnt={};v.forEach(x=>cnt[x]=(cnt[x]||0)+1);const top=Object.entries(cnt).sort((a,b)=>b[1]-a[1]||a[0]-b[0])[0][0];
      const avg=(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1);
      st=Object.keys(cnt).length===1&&v.length>1?`Consensus: <i>${v[0]}</i> points`:`Average <i>${avg}</i> · Most votes <i>${top}</i> · Range ${Math.min(...v)}–${Math.max(...v)}`}
  }
  setHTML($('#stats'),st);
  if(isHost){$('#rv').disabled=rev||!voted;$('#rv').textContent=rev?'Estimates shown':'Show estimates';$('#cl').className='btn'+(rev?' pri':'')}
  else{
    const mine=S.players[meId],lock=rev&&!!(mine&&mine.voted);
    $('#hint').textContent=!rev?'':lock?'Estimates are shown. Voting reopens when the scrum master clears the round.':'Estimates are already shown. Pick a card to add yours.';
    setHTML($('#dk'),DECK.map(n=>`<button class="dc${myVote===n?' sel':''}" data-v="${n}" ${lock?'disabled':''} aria-pressed="${myVote===n}" aria-label="${n} story points">${n}</button>`).join(''));
    $('#topicv').textContent=S.topic||'Waiting for the next story…';
  }
}

async function castVote(n){
  const c=C;if(!c||c.host||!S)return;
  const mine=S.players[c.pid];if(S.revealed&&mine&&mine.voted)return;
  const prev=myVote;myVote=(myVote===n&&!S.revealed)?null:n;c.voting=true;render();
  const{error}=await sb.rpc('cast_vote',{p_code:c.code,p_pid:c.pid,p_secret:c.secret,p_value:myVote});
  c.voting=false;
  if(error){myVote=prev;setConn(friendly(error),'bad')}
  refresh();
}

/* ===== Host room ===== */
async function hostRoom(code){
  isHost=true;shell(true,'Room',code);
  const c=C={code,host:true,pid:null,secret:null,live:false};
  subscribe(c);await refresh();loop(c);
}

/* ===== Team member (no account) ===== */
function joinView(code){
  view(`<main class="wrap narrow"><h1 class="logo">Sprint Planning Poker</h1><p class="lead">You've been invited to a planning poker room. No account needed.</p>
  <div class="panel" id="jf"><label>Your name<input id="jn" required maxlength="30" autocomplete="name" value="${esc(pref.get('pp.name'))}"></label><p class="err" id="je"></p><button class="btn pri" id="jb" type="button" style="width:100%">Join room</button></div></main>`);
  const go=()=>{const n=$('#jn').value.trim();if(!n)return $('#jn').focus();pref.set('pp.name',n);startTeam(code,n)};
  $('#jb').onclick=go;$('#jf').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();go()}};
}
async function joinCall(c){
  let saved=null;try{saved=JSON.parse(store.get('pp.p.'+c.code)||'null')}catch{}
  const{data,error}=await sb.rpc('join_room',{p_code:c.code,p_name:c.name,p_pid:saved&&saved.pid||null,p_secret:saved&&saved.secret||null});
  if(error)throw error;
  c.pid=data.pid;c.secret=data.secret;meId=c.pid;
  store.set('pp.p.'+c.code,JSON.stringify(data));
}
async function startTeam(code,name){
  isHost=false;shell(false,'Sprint Planning Poker',code);
  const c=C={code,host:false,name,pid:null,secret:null,live:false};
  try{await joinCall(c)}catch(e){
    if(c.dead)return;
    const m=String(e.message||e);
    if(m.includes('removed'))store.del('pp.p.'+code);
    return stopRoom(c,friendly(e));
  }
  if(c.dead)return;
  subscribe(c);await refresh();loop(c);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&C===c)refresh()});
}

/* ===== Router and start-up ===== */
async function route(){
  teardown();
  const[,a,b]=location.hash.slice(1).split('/');
  if(a==='join'&&b)return joinView(b.toLowerCase());
  if(recovering)return recoverView();
  if(!me)return authView();
  if(a==='host'&&b)return hostRoom(b.toLowerCase());
  if(a==='admin'){if(me.role==='superadmin')return adminView();location.hash='#/';return}
  dash();
}
(async()=>{
  view('<main class="wrap narrow"><h1 class="logo">Sprint Planning Poker</h1><p class="lead">Loading…</p></main>');
  try{await init()}catch{
    view('<main class="wrap narrow"><h1 class="logo">Sprint Planning Poker</h1><p class="err">Could not load the connection library (Supabase). Your network may be blocking cdn.jsdelivr.net and unpkg.com. Try another network, or ask your admin to allow them.</p></main>');return}
  try{
    const q=new URLSearchParams(location.search);
    urlErr=q.get('error_description')||'';
    await loadMe();
    if(q.has('code')||q.has('error')||q.has('error_description'))history.replaceState(null,'',location.pathname+location.hash);
  }catch{}
  addEventListener('hashchange',route);
  route();
})();
</script>
